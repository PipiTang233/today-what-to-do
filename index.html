<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>今天我想做什么</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <!-- ==================== 首页 ==================== -->
    <div id="page-home" class="page active">
      <div class="home-content">
        <div class="home-icon">✨</div>
        <h1 class="home-title">今天我想做什么</h1>
        <p class="home-subtitle">不知道干什么？点一下试试</p>
        <button id="btn-start" class="btn btn-primary">开始 ›</button>
      </div>
    </div>

    <!-- ==================== 答题页 ==================== -->
    <div id="page-question" class="page">
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="question-card" id="question-card">
        <p class="question-text" id="question-text"></p>
        <div class="options" id="options-container"></div>
      </div>
    </div>

    <!-- ==================== 结果页 ==================== -->
    <div id="page-result" class="page">
      <div class="result-card" id="result-card">
        <div class="result-emoji" id="result-emoji">🎬</div>
        <h2 class="result-name" id="result-name">看一部电影</h2>
        <p class="result-desc" id="result-desc">找一部一直想看但没看过的电影</p>
      </div>
      <div class="result-actions">
        <button id="btn-retry" class="btn btn-secondary">🔄 换一个</button>
        <button id="btn-restart" class="btn btn-ghost">重新开始</button>
        <button id="btn-share" class="btn btn-primary">📤 分享结果</button>
      </div>
    </div>

    <!-- ==================== 分享弹窗 ==================== -->
    <div id="share-modal" class="share-modal">
      <div class="share-modal-content">
        <span class="share-modal-close">&times;</span>
        <div class="share-modal-body">
          <img id="share-image" class="share-image" alt="分享图片" src="">
          <p class="share-modal-hint">长按图片保存，或截图分享给朋友</p>
        </div>
      </div>
    </div>

    <!-- ==================== 分享画布（隐藏，截图用） ==================== -->
    <canvas id="share-canvas" style="display:none"></canvas>
  </div>

  <!-- ==================== 纸屑容器 ==================== -->
  <div id="confetti-container"></div>

  <script src="qrcode-lib.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
